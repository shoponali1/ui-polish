<!--
  UI Polish - Polished 5-State Button Component
  Complies with:
  - 5 Interactive States (Default, Hover, Active, Focus-Visible, Disabled)
  - Micro-compression press down (scale: 0.98)
  - 60fps GPU acceleration (only transform & opacity animated)
  - Custom visible focus ring on keyboard tab
-->

<button class="
  inline-flex items-center justify-center gap-2 px-4 py-2
  text-sm font-medium text-white bg-blue-600 rounded-lg
  border border-transparent shadow-sm
  transition-all duration-150 ease-out
  hover:bg-blue-700 hover:shadow
  active:scale-[0.98] active:bg-blue-800
  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2
  disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed
">
  <!-- Optional optical icon (aligned with text baseline) -->
  <svg class="w-4 h-4 text-white" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
  </svg>
  <span>Save Changes</span>
</button>
