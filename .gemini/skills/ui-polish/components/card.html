<!--
  UI Polish - Concentric Radius Card Component
  Complies with:
  - Concentric Radius: Outer container = 16px, padding = 8px, Inner Card = 8px (Ro = Ri + P)
  - 1px subtle alpha border (rgba(0,0,0,0.08)) over harsh shadows
  - Strict 8pt spacing hierarchy (container padding > child gap)
-->

<div class="p-2 rounded-[16px] bg-slate-100 dark:bg-zinc-800/60 border border-black/5 dark:border-white/10">
  <article class="p-6 rounded-[8px] bg-white dark:bg-zinc-900 border border-black/[0.06] dark:border-white/10 shadow-sm transition-transform duration-150 hover:-translate-y-0.5">
    <div class="flex items-center gap-2 mb-3">
      <span class="px-2 py-0.5 text-xs font-semibold text-blue-700 bg-blue-50 dark:bg-blue-950/60 dark:text-blue-300 rounded-md">
        Cloud Infrastructure
      </span>
    </div>

    <!-- Semantic H3 inside an H2 section -->
    <h3 class="text-base font-semibold text-slate-900 dark:text-zinc-100 tracking-tight text-balance">
      Automated Database Backups with Zero Downtime
    </h3>

    <p class="mt-2 text-sm text-slate-600 dark:text-zinc-400 text-pretty">
      Point-in-time recovery across 3 geographic availability zones with automated integrity validation.
    </p>

    <div class="mt-4 pt-4 border-t border-slate-100 dark:border-zinc-800 flex items-center justify-between">
      <span class="text-xs text-slate-500 dark:text-zinc-500">Updated 2 minutes ago</span>
      <a href="#details" class="text-xs font-medium text-blue-600 dark:text-blue-400 hover:text-blue-700 focus-visible:outline-none focus-visible:underline">
        View Specs
      </a>
    </div>
  </article>
</div>
