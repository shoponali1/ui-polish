<!-- Reusable Schema.org JSON-LD Templates for High Search Visibility -->

<!-- 1. Organization & Brand Knowledge Graph -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Your Company Name",
  "url": "https://example.com",
  "logo": "https://example.com/assets/logo.png",
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+1-800-555-0100",
    "contactType": "customer service",
    "email": "support@example.com"
  },
  "sameAs": [
    "https://twitter.com/yourbrand",
    "https://github.com/yourbrand",
    "https://linkedin.com/company/yourbrand"
  ]
}
</script>

<!-- 2. WebSite + Sitelinks Search Box -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Your Brand",
  "url": "https://example.com",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://example.com/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- 3. FAQPage Schema for Accordion Rich Dropdowns -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is the primary benefit of UI Polish?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "UI Polish guarantees 100% WCAG accessibility, sub-second Core Web Vitals, and zero AI-slop copy across your web product."
      }
    }
  ]
}
</script>
